{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block body %}
<main class="auth"><div class="card">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/></svg></div>
  <h1>Đăng nhập quản trị</h1>
  <p class="sub">Dùng tài khoản được cấp quyền để quản lý chatbot</p>
  <form method="POST" data-loading="Đang đăng nhập...">
    <div class="field"><label for="u">Tên đăng nhập</label>
      <input id="u" type="text" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Mật khẩu</label>
      <div class="pw"><input id="p" type="password" name="password" autocomplete="current-password" required>
      <button type="button" data-toggle-pw>Hiện</button></div></div>
    <button class="btn block" type="submit">Đăng nhập</button>
  </form>
</div></main>
{% endblock %}
