{% extends "base.html" %}
{% block title %} Index {% endblock %}
{% block body%}
<div class="container">

    <div class="header">
        <h2>LOGIN</h2>
    </div>

    <div class="card">
        <h2>Hãy đăng nhập vào tài khoản được cấp quyền để sử dụng</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" style="margin: 16px 0;" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" style="background-color: brown; margin-top: 16px;">
                Đăng nhập
            </button>
        </form>

    </div>

</div>

{% endblock %}
