{% extends "base.html" %}
{% block title %}Sửa FAQ #{{ faq.id }}{% endblock %}
{% block body %}
<main class="container" style="max-width:760px">
  <div class="page-head">
    <div><h1>Sửa FAQ #{{ faq.id }}</h1><p>Cập nhật nội dung rồi nhớ tạo lại chỉ mục tìm kiếm.</p></div>
  </div>
  <section class="card">
    <form action="{{ url_for('edit', id=faq.id) }}" method="POST" data-loading="Đang lưu...">
      <div class="field"><label for="q">Câu hỏi</label>
        <input id="q" name="question" type="text" value="{{ faq.ask }}" required></div>
      <div class="field"><label for="a">Câu trả lời</label>
        <textarea id="a" name="answer" required>{{ faq.answer }}</textarea></div>
      <div class="row" style="justify-content:flex-end">
        <a class="btn ghost" href="{{ url_for('view_faq') }}">Hủy</a>
        <button class="btn" type="submit">Lưu thay đổi</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
