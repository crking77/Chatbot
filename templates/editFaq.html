{% extends "base.html" %}
{% block title %} Index {% endblock %}
{% block body%}
<div class="container">

<div class="header">
<h2>FAQ Edit</h2>
</div>

<div class="card">
<form action="{{url_for('edit',id = faq.id)}}" method="POST">
    
<div class="form-group">
<label>Question</label>
<input name="question" type="text"  value="{{ faq.ask }}">
</div>

<div class="form-group">
<label>Answer</label>
<textarea name="answer">{{ faq.answer }}</textarea>
</div>

<div class="button-group">
<button type="submit" class="add">Update</button>
</div>
</form>

</div>

</div>

{% endblock %}
